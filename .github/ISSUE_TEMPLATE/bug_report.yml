name: Bug report
description: Something in Sentinel doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities:** please don't file them here. See SECURITY.md for how to report privately.
        Remove IPs, hostnames and usernames you don't want to make public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a server running …
        2. …
  - type: input
    id: version
    attributes:
      label: Sentinel version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Your OS
      options: [macOS (Apple Silicon), macOS (Intel), Windows x64, Windows ARM, Linux]
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server OS, if relevant
      placeholder: Ubuntu 24.04, fail2ban 1.0.2, user with passwordless sudo
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      render: text
